<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>夢のまち 拠点（試作）｜ CoreShift for children</title>
  <link rel="icon" href="/icon/アイコン03.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <!-- 夢のまちの拠点：まち全体と6つの建物の画面をならべる。3Dは読みこまない（スマホでも軽い）。
       画面をおすと 3D のページ（view.html）へ。ほかの建物へは、いちどここにもどってから行く。
       前のリンク（?b=X）で来たときは、そのまま 3D のページへ送る -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get("b")) location.replace("./view.html" + location.search);
      if (q.has("show")) { try { q.get("show") === "0" ? localStorage.removeItem("yumemachi_show") : localStorage.setItem("yumemachi_show", "1"); } catch (e) {} }
    })();
  </script>
</head>
<body class="hub">
<header class="bar">
  <span class="logo">CoreShift <small>for children</small></span>
  <span class="tag">試作</span>
</header>

<main class="hubmain">
  <p class="eyebrow">みんなでつくる 福岡・夢のまち</p>
  <h1 class="hubtitle">夢のまちの拠点</h1>
  <p class="hublead">見たい画面をえらんでね。ほかの建物を見るときは、ここにもどってこよう。</p>
  <a class="screen big" id="city" href="./view.html?b=all">
    <span class="pic"><img id="cityimg" alt="夢のまちのジオラマ" width="960" height="480"></span>
    <span class="txt"><b class="badge">まち全体</b><strong>夢のまち（まち全体）</strong><span class="short">6つの班の建物が、福岡のジオラマにならんでいるよ。ぐるっと回して見てみよう。</span></span>
  </a>
  <div class="screens" id="screens"></div>
</main>

<script type="module">
import { BUILDINGS, CITY_THUMB } from "./buildings.js";
const q = new URLSearchParams(location.search), from = q.get("from");
document.getElementById("cityimg").src = CITY_THUMB;
const box = document.getElementById("screens");
box.innerHTML = BUILDINGS.map(o => `
  <a class="screen" href="./view.html?b=${o.id}" data-id="${o.id}" style="--c:${o.color}">
    <span class="pic"><img src="${o.thumb}" alt="${o.name}" width="640" height="480" loading="lazy"></span>
    <span class="txt"><b class="badge">${o.team}</b><strong>${o.name}</strong><span class="area">${o.area}エリア</span><span class="short">${o.short}</span></span>
  </a>`).join("");
// もどってきた建物の画面を光らせる
const back = from && (from === "all" ? document.getElementById("city") : box.querySelector(`[data-id="${from}"]`));
if (back) { back.classList.add("back"); back.scrollIntoView({ block: "center" }); }
// おした画面がぐっと大きくなってから、3Dのページへ（はいる）
document.addEventListener("click", e => {
  const a = e.target.closest("a.screen"); if (!a) return;
  e.preventDefault(); a.classList.add("go"); document.body.classList.add("leaving");
  setTimeout(() => { location.href = a.getAttribute("href"); }, 420);
});
addEventListener("pageshow", () => { document.body.classList.remove("leaving"); document.querySelectorAll(".screen.go").forEach(a => a.classList.remove("go")); });
</script>
</body>
</html>
