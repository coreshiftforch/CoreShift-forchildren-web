<!DOCTYPE html>
<!-- SNS共有画像（images/ogp.jpg, 1200×630）の元。サイトの配色（空色・紺）に合わせる。
     作り方（直したらファイル名を変える。SNSが古い画像を覚えているため）: リポジトリ直下で python3 -m http.server 8000 → Chrome で
     --headless=new --window-size=1200,630 --screenshot=ogp.png http://localhost:8000/tools/ogp.html → JPEG にして images/ogp.jpg に置く -->
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Inter', 'Noto Sans JP', sans-serif; color: #1b2a5e; font-feature-settings: "palt";
    background: linear-gradient(180deg, #c9e9f9 0%, #e3f4fc 55%, #ffffff 100%); position: relative; }
  .band { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: #29abe2; }
  .copy { position: absolute; left: 72px; top: 92px; width: 600px; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.18em; color: #0a74b0; margin-bottom: 26px; }
  h1 { font-size: 58px; line-height: 1.34; font-weight: 900; }
  .logo { position: absolute; left: 72px; bottom: 70px; display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 900; }
  .logo img { height: 40px; }
  .logo small { font-size: 22px; font-weight: 700; color: #4f5a75; margin-left: 4px; align-self: flex-end; padding-bottom: 6px; }
  .photo { position: absolute; right: 64px; top: 120px; width: 420px; height: 390px; object-fit: cover; border-radius: 20px;
    box-shadow: 0 24px 48px rgba(27, 42, 94, 0.18); border: 8px solid #fff; }
  .tags { position: absolute; right: 64px; bottom: 44px; width: 420px; display: flex; justify-content: center; gap: 10px; }
  .tags span { padding: 4px 14px; border-radius: 999px; background: #1b2a5e; color: #fff; font-size: 17px; font-weight: 700; }
</style></head><body>
  <div class="band"></div>
  <div class="copy">
    <p class="eyebrow">福岡市 ・ 子ども向け体験会</p>
    <h1>福岡の子どもたちに、<br>新しい技術を<br>「使ってみる」体験を</h1>
  </div>
  <div class="logo"><img src="/icon/logo-mark.png" alt="">CoreShift<small>コアシフト</small></div>
  <img class="photo" src="/coreshift-for-children/photos/event01_takamiya/S__2965527_0-1200.webp" alt="">
  <div class="tags"><span>3Dプリンター</span><span>AI</span><span>プログラミング</span></div>
</body></html>
