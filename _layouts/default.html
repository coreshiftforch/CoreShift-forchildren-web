<script>
// #13 スクロールで現れる動き（画面に入った要素を少し下から浮かび上がらせる）
(function () {
  if (!('IntersectionObserver' in window)) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var sel = [
    '.sec-head', '.media > *', '.project-card', '.door', '.next-card', '.note', '.facts', '.spec',
    '.features > li', '.cards > *', '.funds > li', '.guide-group', '.steps > li', '.gallery > figure',
    '.models > *', '.report-step', '.labeled', '.cta .wrap > *', '.form',
    '.pgroup', '.pblock', '.process > li', '.flow > li', '.tl-cards > li', '.tl-bar', '.at-a-glance'
  ].join(',');
  var items = Array.prototype.slice.call(document.querySelectorAll('main ' + sel.split(',').join(', main ')));
  if (!items.length) return;
  var vh = window.innerHeight;
  items = items.filter(function (el) {
    // 開いた時点で画面に入っているものは、待たせずにそのまま出す（動かさない）
    if (el.getBoundingClientRect().top < vh) return false;
    el.classList.add('rv');
    // 同じ並びの中では少しずつずらす
    var i = Array.prototype.indexOf.call(el.parentNode.children, el);
    if (el.parentNode.children.length > 1) el.style.setProperty('--rv-delay', Math.min(i, 5) * 0.08 + 's');
    return true;
  });
  if (!items.length) return;
  document.documentElement.classList.add('reveal-on');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  items.forEach(function (el) { io.observe(el); });
})();
</script>

<script>
// #71 画面の高さを測り、ひとまとまり（main の各 section）が1画面に入らないときだけ、中身を縮める（最小 85%）
// 下限: 幅 1301px 以上・高さ 600px 以上の画面だけ。入力フォームのあるまとまりは縮めない
(function () {
  var MIN_W = 1301, MIN_H = 600, MIN_ZOOM = 0.85, MAX_ZOOM = 1.3;
  function fit() {
    var root = document.documentElement;
    root.classList.add('fit-measuring'); // 1画面の高さをいったん外して、中身の本当の高さを測る
    var secs = document.querySelectorAll('main > section');
    var head = document.querySelector('.site-header');
    var ok = window.innerWidth >= MIN_W && window.innerHeight >= MIN_H;
    for (var i = 0; i < secs.length; i++) {
      var sec = secs[i], wrap = sec.querySelector(':scope > .wrap') ;
      var wraps = sec.querySelectorAll(':scope > .wrap');
      for (var k = 0; k < wraps.length; k++) wraps[k].style.zoom = '';
      sec.classList.remove('sec-sparse');
      if (!ok || sec.querySelector('form')) continue;
      var headH = head ? head.offsetHeight : 0;
      // 冒頭（最初のまとまり）はヘッダーと合わせて1画面、ほかはヘッダーの下に1画面
      var avail = window.innerHeight - headH;
      var h = sec.offsetHeight;
      if (h <= avail) {
        // 中身が少ない（画面の6割未満）まとまりは、幅を少し狭めて真ん中に寄せ、文字と画像を大きくする（最大 130%）
        var cs0 = getComputedStyle(sec);
        var pad0 = parseFloat(cs0.paddingTop) + parseFloat(cs0.paddingBottom);
        if (h - pad0 < (avail - pad0) * 0.6 && !sec.classList.contains('hero')) {
          sec.classList.add('sec-sparse');
          var h2 = sec.offsetHeight, ww = 0;
          for (var m = 0; m < wraps.length; m++) ww = Math.max(ww, wraps[m].offsetWidth);
          var up = Math.min(MAX_ZOOM, (avail - pad0 - 4) / (h2 - pad0), (window.innerWidth * 0.94) / (ww || 1));
          if (up > 1.02) for (var m2 = 0; m2 < wraps.length; m2++) wraps[m2].style.zoom = up.toFixed(3);
        }
        continue;
      }
      var cs = getComputedStyle(sec);
      var pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      var z = Math.max(MIN_ZOOM, Math.min(1, (avail - pad - 4) / (h - pad))); // 4px は端数の余裕
      for (var k2 = 0; k2 < wraps.length; k2++) wraps[k2].style.zoom = z.toFixed(3);
    }
    // 各まとまりを、ちょうど1画面（ヘッダーの下）の高さにする。となりのまとまりが映り込まないように
    var hh = head ? head.offsetHeight : 0;
    root.style.setProperty('--avail', (window.innerHeight - hh) + 'px');
    root.classList.toggle('fit-on', ok);
    root.classList.remove('fit-measuring');
  }
  var t;
  function later() { clearTimeout(t); t = setTimeout(fit, 120); }
  window.addEventListener('resize', later);
  window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();
})();
</script>
