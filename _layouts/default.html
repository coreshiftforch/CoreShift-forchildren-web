<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:site_name" content="CoreShift">
  <meta property="og:image" content="{{ site.url }}/images/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
{%- if page.google_verification %}
  <meta name="google-site-verification" content="DxiwSUlddvfgO7YuV0GhDAcWRFCEQJUEOp6-UvYx_lk" />
  <meta name="google-site-verification" content="2aYGIDhPqHuSlo0qt0WGhuidUA6hVcEqNTR4HXhSz0s" />
{%- endif %}
  <link rel="icon" href="/icon/アイコン03.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css?v={{ site.time | date: '%Y%m%d%H%M' }}">
{%- if page.extra_css %}
  <link rel="stylesheet" href="{{ page.extra_css }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
{%- endif %}
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>

{% include header.html %}

{{ content }}

{% include footer.html %}

</body>
</html>
